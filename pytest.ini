[pytest]
; 基础运行参数：-v 详细输出 -s 显示 print/log
addopts = -vs --strict-markers
; 用例目录：只收集 testcase 下的用例，避免误收集 legacy 等目录
testpaths = testcase
; 用例文件 / 类 / 函数的命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test*
; marker 严格校验：出现未注册的 marker 直接报错，而不是静默警告。
; 理由：marker 打错字（如 @pytest.mark.smokes）在默认模式下只是警告，
; 表现为「冒烟筛选悄悄少跑了一批用例」，极难发现；严格模式下立刻失败。
; 已注册 marker：smoke / excel / yaml / mysql / network（见 testcase/conftest.py）。
; Allure 结果目录由 testcase/conftest.py 补全为项目内 report/allure-results
; HTML 报告：由 main.py --report html|both 控制，或直接 pytest --html=report/report.html
;
; CI 中的推荐用法（去掉 -s 以免构建日志刷屏、加覆盖率门槛）：
;   python -m pytest tests -o addopts="" -q --strict-markers
;   python -m pytest tests --cov --cov-fail-under=80
