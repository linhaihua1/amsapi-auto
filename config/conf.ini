; ============================================================================
; 全局配置文件（唯一需要改的地方）
; ----------------------------------------------------------------------------
; 本文件是「所有可变数据的集中落点」：环境、数据源、数据库、日志、报告、认证、
; CI 判定，全部在这里配置，代码里不再散落任何硬编码。
;
; 优先级：环境变量（AMSAPI_*） > 本文件 > 代码内置默认值
; 因此 CI/CD 流水线无需修改本文件，注入环境变量即可（见文末「环境变量速查」）。
;
; 开源说明：本文件**不预置任何真实地址 / 账号 / 密码 / 密钥**，
;          带 url / password / secret / token 字样的项一律留空，
;          请按自己环境填写，或用环境变量注入。
; ============================================================================

[env]
; 环境标识，仅用于日志与报告展示
env = test
; 全局默认域名：用例 url 填相对路径时自动拼接（留空则不拼接，需用例写全 url）
base_url =
; 系统适配档案名：对应 config/systems/<名>.ini
; 换一个被测系统只需改这里（或用环境变量 AMSAPI_SYSTEM=mall），用例数据无需改动；
; default = 内置默认档案，行为与框架原始版本一致
system = default

[run]
; 数据源：excel | yaml | mysql | all
;   excel / yaml / mysql  只运行该数据源的用例
;   all                   同时运行 Excel 与 YAML 驱动（兼容早期版本行为）
; 临时只跑某一种（优先级高于本项）：python main.py -m yaml
data_source = excel
; Excel 用例所在 sheet
sheet_name = test_case_list
; 是否把结果回写数据源（CI 建议 false：不改动仓库文件，也避免并发写冲突）
write_back = true
; 请求超时（秒）
timeout = 10
; 是否校验 https 证书
verify = false
; 是否只跑冒烟用例（CI/CD 构建后快速验证；也可用 python main.py --smoke 或 AMSAPI_SMOKE=1）
smoke = false
; 冒烟标签（对应用例数据的 tags 字段，命中任意一个即执行）
tags = smoke

[db]
; MySQL 数据源配置（data_source=mysql 时生效）
; 留空表示「未配置」，框架不会去连库；请按自己环境填写或注入 AMSAPI_DB_* 环境变量
host =
user =
password =
database =
; 端口默认取 MySQL 标准端口；非标准端口在此覆盖
port = 3306
charset = utf8
; MySQL 数据源：业务标识（对应 test_case_list.web）与配置环境（对应 test_config.environment）
; 这两个值只是数据库表里的筛选条件，请按自己业务库填写
web =
environment =

[report]
; 报告类型：allure | html | both | none（main.py 的 --report 参数可临时覆盖）
report_type = allure
; 报告标题（写入 Allure「环境」页与 pytest-html 页面标题）
title = 接口自动化测试
; 项目名（写入 Allure「环境」页）
project = amsapi-auto
; pytest-html 报告文件名，生成在 report/ 下
html_name = report.html
; Allure 单条附件最大字符数：超出即截断，防止超大响应体拖慢报告渲染
max_attach_len = 20000

[log]
; 日志级别：DEBUG | INFO | WARNING | ERROR
level = DEBUG
; 控制台输出级别（CI 里想少刷屏可调成 INFO）
console_level = DEBUG
; 日志文件名（strftime 格式，按天滚动）：%Y_%m_%d -> 2026_09_27.log
file_name_format = %Y_%m_%d
; 日志行格式
format = %(asctime)s | %(levelname)-7s | %(filename)s:%(lineno)d | %(message)s
; 日志时间格式
date_format = %Y-%m-%d %H:%M:%S
; logger 根名称（决定日志器命名前缀）
root_name = amsapi
; 敏感信息脱敏：日志与 Allure 报告中的口令 / 令牌 / 票据一律打码
; 强烈建议保持 true —— 日志与报告会随构建制品归档、被转发，明文即等同口令外泄
mask_sensitive = true
; 单个日志文件大小上限（字节）：超过后自动轮转出 .1/.2 备份；0 = 不限大小
; 一次全量回归可能产生上百 MB 日志，单文件既难打开也难归档
max_bytes = 20971520
; 轮转备份个数
backup_count = 5
; 历史日志保留天数：启动时清理更早的按天日志（只删框架自己生成的文件）；0 = 不清理
keep_days = 30

[mask]
; 打码模式：partial = 保留首尾少量字符（便于判断是不是同一个令牌）；full = 全遮蔽
; 生产 / 对外共享的报告建议用 full
mode = partial
; partial 模式下保留的前缀 / 后缀字符数
keep_prefix = 3
keep_suffix = 2
; 追加的敏感字段名（逗号分隔），用于业务自定义字段，如 mobile,idcard,bankCard
extra_keys =

[network]
; 是否沿用系统代理设置（HTTP_PROXY / HTTPS_PROXY / NO_PROXY）
; 置 false 时完全忽略系统代理（requests 的 trust_env=False）
trust_env = true
; 目标为环回 / 私网地址（127.0.0.1、10.x、172.16-31.x、192.168.x、*.local）时自动绕过代理
; 必须保持 true：CI 机器与办公网普遍配置了「出公网」代理，
; 若不绕过，访问内网被测系统的请求会被代理拦截，报出指不到根因的 502
auto_bypass_proxy = true
; 额外指定不走代理的主机（逗号分隔，支持域名后缀与网段前缀），如 corp.internal,10.
bypass_hosts =

[auth]
; OAuth2 令牌到期前多少秒提前续期（避免边界上刚好失效）
refresh_ahead = 60
; OAuth2 取令牌请求超时（秒）
token_timeout = 10
; OAuth2 取令牌时是否校验 https 证书
token_verify = false

[ci]
; 出现下列任一环境变量即判定为「运行在 CI 流水线中」（逗号分隔）
; 用途：自动跳过本地 HTML 报告渲染，缩短构建时长
detect_env_vars = JENKINS_URL,JENKINS_HOME,GITLAB_CI,BUILD_NUMBER,GITHUB_ACTIONS,TF_BUILD,CI

; ============================================================================
; 环境变量速查（优先级高于本文件，CI/CD 中推荐用环境变量而非改文件）
; ----------------------------------------------------------------------------
;   AMSAPI_CONF_FILE        指定另一份配置文件路径
;   AMSAPI_ENV              环境标识
;   AMSAPI_BASE_URL         全局域名
;   AMSAPI_SYSTEM           系统适配档案名
;   AMSAPI_DATA_SOURCE      excel | yaml | mysql
;   AMSAPI_SHEET_NAME       Excel sheet 名
;   AMSAPI_WRITE_BACK       是否回写（true/false）
;   AMSAPI_TIMEOUT          请求超时（秒）
;   AMSAPI_VERIFY           是否校验 https 证书
;   AMSAPI_REPORT_TYPE      allure | html | both | none
;   AMSAPI_SMOKE            是否只跑冒烟（true/false）
;   AMSAPI_TAGS             冒烟标签，逗号分隔
;   AMSAPI_WEB              MySQL 业务标识
;   AMSAPI_DB_ENVIRONMENT   MySQL 配置环境
;   AMSAPI_DB_HOST / AMSAPI_DB_PORT / AMSAPI_DB_USER
;   AMSAPI_DB_PASSWORD / AMSAPI_DB_NAME / AMSAPI_DB_CHARSET
;   AMSAPI_LOG_LEVEL        日志级别（DEBUG|INFO|WARNING|ERROR）
;   AMSAPI_LOG_CONSOLE_LEVEL 控制台日志级别
;   AMSAPI_MASK_SENSITIVE   是否脱敏（true/false）
;   AMSAPI_MASK_MODE        打码模式（partial|full）
;   AMSAPI_MASK_EXTRA_KEYS  追加的敏感字段名，逗号分隔
;   AMSAPI_TRUST_ENV        是否沿用系统代理（true/false）
;   AMSAPI_AUTO_BYPASS_PROXY 内网地址是否自动绕过代理（true/false）
;   AMSAPI_BYPASS_HOSTS     额外不走代理的主机，逗号分隔
;   AMSAPI_LOG_MAX_BYTES    单个日志文件大小上限（字节）
;   AMSAPI_LOG_KEEP_DAYS    历史日志保留天数（0 = 不清理）
;   AMSAPI_REPORT_TITLE     报告标题
;   AMSAPI_ALLURE_MAX_ATTACH_LEN  Allure 单条附件最大字符数
;   AMSAPI_OAUTH2_REFRESH_AHEAD  OAuth2 提前续期秒数
;   AMSAPI_RENDER_ALLURE    置 1 时即使检测到 CI 也渲染本地 HTML 报告
; ============================================================================
