; =====================================================================
; 财务 / ERP 类系统档案示例（finance_erp）
; =====================================================================
; 财务与 ERP 系统的典型特征，本档案逐条给出了对应开关：
;   · 多为表单提交（application/x-www-form-urlencoded）或老式 XML 报文
;   · 返回值是 {code, msg, data}，业务失败也可能返回 HTTP 200
;   · 用会话 Cookie 或固定 API Key 认证，少有 OAuth2
;   · 单据类接口「写进去」后需要查库核对，用完必须清理（teardown）
;   · 字段是中文、可能 GBK 编码
;
; 启用方式：conf.ini 的 [env] system = finance_erp，或 AMSAPI_SYSTEM=finance_erp

[system]
name = 财务 / ERP
description = 表单提交 + code 风格响应 + 会话 Cookie 认证；单据需查库核对并清理

; ---------------------------------------------------------------------
[env]
base_url = http://erp.example.com:8080
timeout = 30
verify = false

; 老 ERP 大量使用 GBK；若接口返回中文乱码，把这里改成 gbk 或 gb2312
encoding =

; 默认按表单提交 —— 财务/ERP 最普遍的载体类型
content_type = application/x-www-form-urlencoded

; 若对方是 XML 报文接口，改成 xml 让它按 XML 解析：
;   response_format = xml
response_format = auto

; ---------------------------------------------------------------------
[hosts]
; ERP 常见「主站 + 报表服务」分离：
; erp     = http://erp.example.com:8080
; report  = http://report.example.com:8081

; ---------------------------------------------------------------------
[headers]
X-Client = amsapi-auto
Accept = application/json, text/plain, */*

; ---------------------------------------------------------------------
[cookies]
; 老 ERP 常需要预置会话 Cookie 才能访问；登录接口拿到后也可由 relation 写入变量池
; JSESSIONID = xxxxxxxx

; ---------------------------------------------------------------------
[response]
; 财务 / ERP 最常见：{"code": 200, "msg": "操作成功", "data": {...}}
; 注意：这类系统业务失败时 HTTP 仍可能返回 200，所以必须看 code 而不是看 HTTP
style = code
http_ok = 200

; 若对方的成功码不是 200（如 0 表示成功），把 success_values 打开，
; 这样用例里就不用每条都写 expected_code：
;   success_values = 0

; 字段名非标准时显式指定：
;   success_path = body.returnCode
;   message_path = body.returnMsg
;   data_path    = body.rows

; ---------------------------------------------------------------------
[auth]
; 方式一：会话 Cookie（老 ERP 最常见）
type = cookie
cookie_string =

; 方式二：固定 API Key
;   type = apikey
;   key_name = X-Api-Key
;   token = 你的密钥
;   key_in = header

; 方式三：账号密码 Basic
;   type = basic
;   username = admin
;   password = ${erp_password}

; ---------------------------------------------------------------------
[hooks]
; 财务系统常见「参数 MD5 签名」，打开即用：
;   before_request = common.hooks:make_sign_hook({"field": "sign", "salt": "对方给的盐", "alg": "md5", "upper": true, "exclude": ["sign"]})
;
; 若报文整体加密（AES/ECB/PKCS5 最常见）：
;   before_request = common.hooks:make_aes_hook({"key": "16位密钥", "fields": ["data"], "mode": "ECB"})
;   after_response = common.hooks:make_decrypt_response_hook({"key": "16位密钥", "fields": ["data"]})
;
; 上面两个 AES 钩子需要可选依赖：pip install cryptography
before_request =
after_response =
