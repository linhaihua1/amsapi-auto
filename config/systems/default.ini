; =====================================================================
; 默认系统档案（default）
; =====================================================================
; 不启用任何适配差异，行为与框架原始版本完全一致。
;
; 这个文件有两个作用：
;   1. 没有特殊适配需求时的落点（conf.ini 的 [env] system 留空即为 default）
;   2. 其它系统档案的抄写模板 —— 复制成 你的系统.ini 再按需改
;
; 切换系统：在 conf.ini 写 system = default，或用环境变量 AMSAPI_SYSTEM=default
; 字段完整说明见 docs/08-系统适配指南.md

[system]
name = 默认
description = 不启用系统适配；响应判定取 body.status（框架原始行为）

; ---------------------------------------------------------------------
[env]
; 主域名：用例 url 填相对路径时自动拼接。
; 留空 = 用例自带完整 url；CI 里可用 AMSAPI_BASE_URL 临时覆盖（优先级更高）
base_url =

; 请求超时（秒）。留空则用 conf.ini 的 [run] timeout。
; 注意优先级：AMSAPI_TIMEOUT 环境变量 > 这里 > conf.ini [run] timeout
; 只想改超时而不想动档案时，改 conf.ini 即可（留空这里）
timeout =

; 是否校验 https 证书。留空则用 conf.ini 的 [run] verify
; 优先级同 timeout：AMSAPI_VERIFY > 这里 > conf.ini
verify =

; 响应字符编码：留空自动判断。
; 政务 / 财务的老系统若是 GBK、GB2312，在这里写死，否则中文会乱码
encoding =

; 默认请求体类型：用例没写 Content-Type 时使用
content_type =

; 响应体解析格式：auto | json | xml | text
;   auto  先试 json，失败给文本（默认，与原始行为一致）
;   xml   按 XML 解析（政务 / 财务 / SOAP 系统用）
;   text  一律给文本
response_format = auto

; ---------------------------------------------------------------------
[hosts]
; 域名别名 = 真实域名，一行一个。
; 用途：网关 + 多服务的系统（中台 / 微服务），用例里写 别名:/path 即可换域名。
; 也可由用例字段 host=别名 指定。
; 示例：
;   gateway = https://gateway.example.com
;   user    = https://user.example.com

; ---------------------------------------------------------------------
[headers]
; 所有请求都会带上的默认请求头。键名大小写敏感（X-Auth-Token 不会被改成小写）。
; 示例：
;   X-Client = amsapi-auto

; ---------------------------------------------------------------------
[cookies]
; 所有请求都会带上的默认 Cookie。示例：
;   JSESSIONID = abc123

; ---------------------------------------------------------------------
[response]
; 判定风格，六选一 —— 决定「业务成功」看哪个字段：
;   status    {"status": 200}
;   code      {"code": 200, "msg": "...", "data": {...}}
;   success   {"success": true, "result": {...}}
;   errno     {"errno": 0}
;   retcode   {"retCode": "0000"}
;   raw       不看业务码，只看 HTTP 状态码
style = status

; 业务码路径：留空则用风格的默认候选。字段名特殊时在这里显式指定
; 例：body.returnCode
success_path =

; 成功值集合：用例没写 expected_code 时用。逗号分隔。
; status / code 风格例外 —— 它们靠用例的 expected_code 比对，这里留空即可
success_values =

; 错误消息路径 / 业务数据路径：留空则按常见字段名自动探测
message_path =
data_path =

; 视为成功的 HTTP 状态码
http_ok = 200,201,202,204

; ---------------------------------------------------------------------
[auth]
; 认证方式：none | basic | bearer | header | apikey | cookie | oauth2
type = none

; --- basic ---        username / password
; --- bearer ---       token（支持 ${变量}，如 ${token}）；header 默认 Authorization；prefix 默认 "Bearer "
; --- header ---       header（如 access-ticket）+ token + prefix
; --- apikey ---       key_name（如 X-Api-Key）+ token + key_in（header | query）
; --- cookie ---       cookie_string（"a=1; b=2"）或 cookies（JSON 对象）
; --- oauth2 ---       token_url + client_id + client_secret + scope + auth_mode(post|basic)

; ---------------------------------------------------------------------
[hooks]
; 请求前 / 响应后钩子，用于签名、时间戳防重放、报文加解密。
; 逗号分隔，支持三种写法（工厂函数必须带括号调用，否则会被当成普通函数引用而报错）：
;   包.模块:函数名                               直接引用现成函数
;   common.hooks:make_timestamp_nonce_hook()     调用工厂（不带参数）
;   common.hooks:make_sign_hook({"salt": "abc"}) 调用工厂并传 JSON 参数
;
; 可用工厂（见 common/hooks.py）：
;   make_timestamp_nonce_hook  注入时间戳 + 随机串，防重放
;   make_sign_hook             参数排序拼串后摘要，写入报文字段或请求头
;   make_aes_hook              AES 加密指定字段（需可选依赖 cryptography）
;   make_decrypt_response_hook AES 解密响应字段（需可选依赖 cryptography）
;   make_token_response_hook   把响应里的令牌自动写入变量池
before_request =
after_response =
