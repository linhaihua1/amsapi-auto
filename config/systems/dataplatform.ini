; =====================================================================
; 数据中台 / 信息系统档案示例（dataplatform）
; =====================================================================
; 数据中台与内部信息系统的典型特征，本档案逐条给出对应开关：
;   · OAuth2 client_credentials 或固定 API Key（机器对机器调用）
;   · 一个网关下挂多个数据服务（用 [hosts] 别名）
;   · 返回结构不统一：{"code": 0}、{"errno": 0}、{"retCode": "0000"} 都可能
;   · 列表接口统一分页协议（page / pageSize，或 pageNum / pageSize）
;   · 返回值结构复杂，适合用 JSON Schema 校验（需可选依赖 jsonschema）
;   · 通常返回 UTF-8 JSON，中文无编码问题
;
; 启用方式：conf.ini 的 [env] system = dataplatform，或 AMSAPI_SYSTEM=dataplatform

[system]
name = 数据中台 / 信息系统
description = OAuth2 客户端模式 + 网关多服务 + 统一分页；返回值结构用 Schema 校验

; ---------------------------------------------------------------------
[env]
base_url = http://api.dataplatform.local
timeout = 20
verify = false
encoding =
content_type = application/json
response_format = auto

; ---------------------------------------------------------------------
[hosts]
; 中台常见：一个网关 + 若干数据服务
; 用例里写 meta:/v1/datasource/list、etl:/v1/job/run 即可
api = http://api.dataplatform.local
meta = http://meta.dataplatform.local
etl = http://etl.dataplatform.local

; ---------------------------------------------------------------------
[headers]
Content-Type = application/json
X-Client = amsapi-auto

; ---------------------------------------------------------------------
[response]
; 中台常见 {"code": 0, "msg": "success", "data": {...}}，0 表示成功。
; 这里配了 success_values，所以用例里通常不必再写 expected_code。
style = code
success_values = 0
message_path = body.msg
data_path = body.data
http_ok = 200

; 若对方是用 {"errno": 0} 的形态，改 style = errno（自带成功值 0 / 200）
; 若对方是 {"retCode": "0000"}，改 style = retcode（自带 0000 / 0 / 200 / success）

; ---------------------------------------------------------------------
[auth]
; 机器对机器调用最常见：OAuth2 客户端模式。
; 框架会自动取令牌、按 expires_in 缓存、到期前 60 秒续期，用例侧无感。
type = oauth2
token_url = http://api.dataplatform.local/oauth/token
client_id = your_client_id
client_secret = your_client_secret
scope = read
header = Authorization
prefix = Bearer
; 有的平台要求客户端凭证走 HTTP Basic 而不是表单，此时改成 basic
auth_mode = post

; 若只是固定 API Key，改成：
;   type = apikey
;   key_name = X-Api-Key
;   token = 你的密钥
;   key_in = header

; ---------------------------------------------------------------------
[hooks]
; 中台较少用签名；若有「按参数排序 MD5 签名」的保护，打开即可：
;   before_request = common.hooks:make_sign_hook({"field": "sign", "salt": "平台分配的密钥", "alg": "md5", "upper": true, "exclude": ["sign"]})
before_request =
after_response =
