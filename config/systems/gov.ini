; =====================================================================
; 党政 / 政务类系统档案示例（gov）
; =====================================================================
; 政务系统的典型形态：**票据认证 + status 风格响应**，本档案逐条给出开关：
;   · 登录换票据，后续接口在自定义请求头里带票据（access-ticket / token）
;   · 请求需要签名（sign + timestamp + nonce 防重放）
;   · 老系统可能返回 GBK 文本、或 XML 报文
;   · 部分系统用国密 SM 系列算法（需自行在项目内实现钩子，框架留口）
;
; 本档案是**通用模板**，不含任何真实地址与账号：
;   · base_url 用占位域名，实际跑用例时用 AMSAPI_BASE_URL 覆盖即可
;   · 想零依赖体验完整链路，见 docs/02-操作手册.md「不连内网也能跑通」
;
; 启用方式：conf.ini 的 [env] system = gov，或 AMSAPI_SYSTEM=gov

[system]
name = 党政 / 政务门户（示例）
description = 票据认证 + status 风格响应；登录接口提取 ticket，后续接口用 access-ticket 请求头携带

; ---------------------------------------------------------------------
[env]
; 占位域名：真实地址请用 AMSAPI_BASE_URL 注入，避免把环境地址写进仓库
base_url = https://gov.example.com
timeout = 15
verify = false

; 该环境返回 UTF-8 JSON，无需强制编码。
; 若换成返回 GBK 的老政务系统，改成 encoding = gbk（或用 AMSAPI_ENCODING=gbk）
encoding =
content_type = application/json
response_format = auto

; ---------------------------------------------------------------------
[hosts]
; 政务系统常见「门户 + 后台」两个域名，可按需打开。
; 每个别名都可用 AMSAPI_HOST_<别名大写> 覆盖，如 AMSAPI_HOST_PORTAL=https://gov-test.example.com
; portal = https://portal.example.com
; admin  = https://admin.example.com

; ---------------------------------------------------------------------
[headers]
Content-Type = application/json

; ---------------------------------------------------------------------
[response]
; 该系统返回 {"status": 200, "data": {...}}，用 status 风格
style = status
http_ok = 200

; ---------------------------------------------------------------------
[auth]
; 登录接口用 relation 提取 ticket 进变量池后，后续接口自动在请求头带上。
; ${ticket} 会在**每次请求前**从变量池实时解析，因此无需改用例顺序依赖的代码。
type = header
header = access-ticket
token = ${ticket}

; ---------------------------------------------------------------------
[hooks]
; 该系统当前无需签名，保持为空。
;
; 若对接需要签名的政务系统，按下面方式打开（示例，字段名按对方文档改）：
;   before_request = common.hooks:make_timestamp_nonce_hook({"fields": ["timestamp", "nonce"], "ts_unit": "ms"}), common.hooks:make_sign_hook({"field": "sign", "salt": "你的盐值", "alg": "md5", "upper": true})
;
; 若响应是 GBK 且字段需要解密：
;   after_response = common.hooks:make_decrypt_response_hook({"key": "16位密钥", "fields": ["data"]})
before_request =
after_response =
