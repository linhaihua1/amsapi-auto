; =====================================================================
; 商城 / 购物类系统档案示例（mall）
; =====================================================================
; 商城系统的典型特征，本档案逐条给出对应开关：
;   · JWT / Bearer Token 认证，令牌有有效期
;   · 微服务架构：网关 + 商品/订单/支付多个域名（用 [hosts] 别名）
;   · 返回 {"success": true, "result": {...}}，或不返回业务码只看 HTTP
;   · 下单、支付这类写接口必须造前置数据，跑完必须清理（setup / teardown）
;   · 列表接口要翻页（用例层调用 paginate()）
;   · 金额字段需要范围断言（gt / lt），下单响应有时长要求（elapsed）
;
; 启用方式：conf.ini 的 [env] system = mall，或 AMSAPI_SYSTEM=mall

[system]
name = 商城 / 购物
description = JWT 认证 + 网关多域名 + success 风格响应；写接口需前置准备与后置清理

; ---------------------------------------------------------------------
[env]
base_url = http://gateway.mall.com
timeout = 10
verify = false
encoding =
content_type = application/json
response_format = auto

; ---------------------------------------------------------------------
[hosts]
; 微服务常见形态：用例里写 user:/v1/profile、order:/v1/orders 即可路由到不同服务
gateway = http://gateway.mall.com
user = http://user-service.mall.com
order = http://order-service.mall.com
goods = http://goods-service.mall.com

; ---------------------------------------------------------------------
[headers]
Content-Type = application/json
X-Client = amsapi-auto

; ---------------------------------------------------------------------
[response]
; 商城常见：{"success": true, "result": {...}, "message": ""}
style = success
; success 风格自带成功值集合（true / 1 / yes / ok），
; 因此用例里通常不必再写 expected_code
http_ok = 200,201,204

; 若对方是 {"errno": 0} 风格，改成：
;   style = errno

; ---------------------------------------------------------------------
[auth]
; JWT：登录接口把令牌写进变量池（relation: token=body.result.accessToken），
; 后续接口自动带上 Authorization: Bearer <token>
type = bearer
token = ${token}
header = Authorization
prefix = Bearer

; 若令牌只在 query 里传：
;   type = apikey
;   key_name = access_token
;   key_in = query
;   token = ${token}

; 若走 OAuth2 授权码/客户端模式，改用：
;   type = oauth2
;   token_url = http://gateway.mall.com/oauth/token
;   client_id = xxx
;   client_secret = yyy
;   scope = read write

; ---------------------------------------------------------------------
[hooks]
; 商城常见的签名场景（如「下单防篡改」）：
;   before_request = common.hooks:make_timestamp_nonce_hook({"fields": ["timestamp", "nonce"], "ts_unit": "ms"}), common.hooks:make_sign_hook({"field": "sign", "salt": "appSecret", "alg": "sha256", "upper": false})
;
; 把登录响应里的令牌自动入池（这样连 relation 都不用配）：
;   after_response = common.hooks:make_token_response_hook({"token_path": "body.result.accessToken", "var_name": "token"})
before_request =
after_response =
