; ============================================================================
; CI/CD 专用配置示例
; ============================================================================
; 用途：流水线（Jenkins / GitLab CI 等）中使用的参考配置。
;
; 使用方式（二选一）：
;   方式一（推荐）：不改文件，用环境变量覆盖，见下方「环境变量」注释
;   方式二：通过 AMSAPI_CONF_FILE 指向本文件
;           AMSAPI_CONF_FILE=config/conf.ci.ini python main.py --report allure
;
; 注意：本文件默认不会被加载（settings 只读 conf.ini）。
;       它是一份参考模板，可按需复制修改。
; ============================================================================

[env]
; 环境标识：CI 中建议用环境变量注入，如 AMSAPI_ENV=uat
env = test
; 全局域名：CI 中建议用 AMSAPI_BASE_URL 注入，避免把环境地址写死在仓库里
base_url =

[run]
; 数据源：excel | yaml | mysql
data_source = excel
; Excel 用例所在 sheet
sheet_name = test_case_list
; 是否回写结果：CI 建议 false —— 不改动仓库文件，也避免并发写冲突
write_back = false
; 请求超时：CI 网络较慢或被压测影响时，建议比本地更宽松
timeout = 30
; 是否校验 https 证书
verify = false
; 是否只跑冒烟用例：也可用命令行 --smoke 或 AMSAPI_SMOKE=1
smoke = false
; 冒烟标签（对应用例数据的 tags 字段）
tags = smoke

[db]
; 使用 MySQL 数据源时在 CI 中注入，**不要**把任何真实凭据写进仓库。
; 这里一律留空：与 conf.ini 的合规要求一致（见 tests/test_repo_sanitized.py）。
;   AMSAPI_DB_HOST / AMSAPI_DB_PORT / AMSAPI_DB_USER
;   AMSAPI_DB_PASSWORD / AMSAPI_DB_NAME
host =
user =
password =
database =
port = 3306
charset = utf8
; MySQL 数据源的业务标识与环境标识（对应库表里的筛选条件），按自己业务库填写
web =
environment =

[log]
; CI 里控制台日志调成 INFO 可显著减少刷屏（构建日志动辄上万行）
console_level = INFO
; 脱敏在 CI 中必须保持开启：构建日志会长期留存并被多人查看
mask_sensitive = true

[mask]
; CI 产物通常会被归档、被转发，建议使用全遮蔽
mode = full

[report]
; 报告类型：CI 中通常只需产出 allure-results，由流水线插件渲染
report_type = allure

; ============================================================================
; 环境变量速查（优先级高于本文件）
; ----------------------------------------------------------------------------
;   AMSAPI_CONF_FILE        指定配置文件路径
;   AMSAPI_ENV              环境标识
;   AMSAPI_BASE_URL         全局域名
;   AMSAPI_DATA_SOURCE      excel | yaml | mysql
;   AMSAPI_SHEET_NAME       Excel sheet 名
;   AMSAPI_WRITE_BACK       是否回写（true/false）
;   AMSAPI_TIMEOUT          请求超时（秒）
;   AMSAPI_VERIFY           是否校验 https 证书
;   AMSAPI_REPORT_TYPE      allure | html | both | none
;   AMSAPI_SMOKE            是否只跑冒烟（true/false）
;   AMSAPI_TAGS             冒烟标签，逗号分隔
;   AMSAPI_WEB              MySQL 业务标识
;   AMSAPI_DB_ENVIRONMENT   MySQL 配置环境
;   AMSAPI_DB_HOST / AMSAPI_DB_PORT / AMSAPI_DB_USER
;   AMSAPI_DB_PASSWORD / AMSAPI_DB_NAME / AMSAPI_DB_CHARSET
;   AMSAPI_RENDER_ALLURE    置 1 时即使检测到 CI 也渲染本地 HTML 报告
; ============================================================================
